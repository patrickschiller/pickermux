name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged macOS release source
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 22.15
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
      - name: Require the exact current main commit and version
        shell: bash
        run: |
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          test "$(node -p '"v" + JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')" = "$GITHUB_REF_NAME"
      - name: Verify source and deterministic tests
        run: npm run verify
      - name: Verify native app and core tests
        run: swift test --package-path macos --scratch-path "$RUNNER_TEMP/pickermux-release-swift"

  signed-dmg:
    name: Build Developer ID signed and notarized DMG
    needs: verify
    if: vars.PICKERMUX_SIGNING_RUNNER_ENABLED == 'true'
    # Opt in only after provisioning the runner and protected environment.
    # Local production releases follow the same gates in docs/RELEASING.md.
    # Signing is confined to the provisioned runner and protected environment.
    # Apple Development and unsigned builds are never publication candidates.
    runs-on: [self-hosted, macOS, pickermux-signing]
    environment: companion-signing
    timeout-minutes: 50
    steps:
      - name: Check out verified tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck exact main commit
        shell: bash
        run: test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
      - name: Set up Node.js 22.15
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
      - name: Build signed, notarized and stapled app and DMG
        env:
          PICKERMUX_SIGNING_IDENTITY: ${{ vars.PICKERMUX_SIGNING_IDENTITY }}
          PICKERMUX_NOTARY_PROFILE: ${{ vars.PICKERMUX_NOTARY_PROFILE }}
        run: node scripts/build-companion.mjs --release --output "$RUNNER_TEMP/pickermux-signed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Stage one immutable DMG and bound release notes
        run: node scripts/prepare-dmg-release.mjs --source "$RUNNER_TEMP/pickermux-signed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output "$RUNNER_TEMP/pickermux-public-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --tag "$GITHUB_REF_NAME"
      - name: Retain verified publication candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dmg-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/pickermux-public-${{ github.run_id }}-${{ github.run_attempt }}/PickerMux-macos-universal.dmg
            ${{ runner.temp }}/pickermux-public-${{ github.run_id }}-${{ github.run_attempt }}/release-notes.md
            ${{ runner.temp }}/pickermux-public-${{ github.run_id }}-${{ github.run_attempt }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish DMG-only GitHub release
    needs: signed-dmg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out publication verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck exact main commit before publication
        run: test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
      - name: Set up Node.js 22.15
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
      - name: Download verified publication candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dmg-${{ github.ref_name }}
          path: release-assets
      - name: Recheck exact inventory, checksum and release record
        run: node scripts/prepare-dmg-release.mjs --verify release-assets --tag "$GITHUB_REF_NAME"
      - name: Publish only the DMG without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release already exists; refusing to replace assets." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/PickerMux-macos-universal.dmg \
            --verify-tag \
            --title "PickerMux $GITHUB_REF_NAME" \
            --notes-file release-assets/release-notes.md
