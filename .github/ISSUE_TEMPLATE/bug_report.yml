name: Bug report
description: Report reproducible PickerMux behavior that appears incorrect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve PickerMux. This is an unofficial community project.

        Do not paste tokens, cookies, account IDs, private prompts, local capability paths, or unredacted logs. Report security vulnerabilities privately according to SECURITY.md.

  - type: input
    id: version
    attributes:
      label: PickerMux version
      description: Provide a release version or commit SHA.
      placeholder: v0.5.1 or abc1234
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.x
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Run `node --version`.
      placeholder: v22.15.0
    validations:
      required: true

  - type: input
    id: codex
    attributes:
      label: Codex Desktop version
      placeholder: Version and build number
    validations:
      required: true

  - type: input
    id: lmstudio
    attributes:
      label: LM Studio version
      description: Enter `Not involved` if the problem affects native routing only.
      placeholder: Version or Not involved
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model and reasoning mode
      description: Include the picker name and upstream model ID when relevant.
      placeholder: Qwen3.8 27B - LM Studio, medium

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence, including exact PickerMux commands.
      placeholder: |
        1. Load ... in LM Studio.
        2. Run ...
        3. Quit and reopen Codex Desktop.
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Redacted doctor output
      description: Paste relevant output from `pickermux doctor` or `pickermux doctor --live`. Redact all private values first.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add redacted logs, screenshots, or other context. Drag files into this field if needed.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I reproduced this with the latest release or default branch.
          required: true
        - label: I removed credentials, account data, capability paths, private prompts, and other sensitive information.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
